 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة التسوق</title>
    <style>
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .invoice-box {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border: 1px solid #eee;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .invoice-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
            background: #f9f9fb;
            padding: 15px;
            border-radius: 6px;
        }
        .invoice-header div {
            flex: 1;
            min-width: 200px;
        }
        .invoice-header label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        .invoice-header input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            line-height: inherit;
            text-align: right;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table th, table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        table th {
            background-color: #007bff;
            color: white;
        }
        input[type="text"], input[type="number"] {
            width: 90%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .controls-btn {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-print {
            background-color: #17a2b8;
        }
        .btn-save {
            background-color: #ffc107;
            color: #000;
        }
        .btn-danger {
            background-color: #dc3545;
            padding: 5px 10px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .summary-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid #007bff;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 16px;
            color: #333;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
        }
        .discount-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .discount-container input {
            width: 80px;
            padding: 5px;
            text-align: center;
        }
        .final-total {
            font-size: 18px;
            font-weight: bold;
            color: #d9534f;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }

        /* تنسيقات خاصة بالطباعة والحفظ */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .invoice-box {
                box-shadow: none;
                border: none;
                width: 100%;
                max-width: 100%;
                padding: 0;
            }
            .controls-btn, .action-col {
                display: none !important;
            }
            input {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
            }
            .invoice-header {
                background: transparent !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body>

<div class="invoice-box">
    <h2>فاتورة التسوق </h2>

    <!-- قسم معلومات الزبون والتاريخ -->
    <div class="invoice-header">
        <div>
            <label for="customerName">اسم الزبون:</label>
            <input type="text" id="customerName" placeholder="أدخل اسم الزبون">
        </div>
        <div>
            <label for="invoiceDate">تاريخ الفاتورة:</label>
            <input type="date" id="invoiceDate">
        </div>
    </div>

    <table id="invoiceTable">
        <thead>
            <tr>
                <th>اسم المادة</th>
                <th>سعر الوحدة</th>
                <th>العدد</th>
                <th>السعر الإجمالي</th>
                <th class="action-col">إجراء</th>
            </tr>
        </thead>
        <tbody id="rowsContainer">
            <!-- الأسطر تضاف ديناميكياً -->
        </tbody>
    </table>

    <div class="controls-btn">
        <button type="button" class="btn" onclick="addRow()">+ إضافة مادة جديدة</button>
        <button type="button" class="btn btn-print" onclick="window.print()">🖨️ طباعة الفاتورة</button>
        <button type="button" class="btn btn-save" onclick="window.print()">💾 حفظ كـ PDF</button>
    </div>

    <div class="summary-section">
        <div class="summary-row">
            <div>عدد أنواع المشتريات: <span id="itemsCount">0</span> نوع</div>
            <div>المجموع الفرعي: <span id="subTotal">0.00</span> دج</div>
        </div>
        <div class="summary-row discount-container">
            <div>نسبة الخصم (%):</div>
            <div><input type="number" id="discountPercent" min="0" max="100" value="0" oninput="updateSummary()"> %</div>
        </div>
        <div class="summary-row final-total">
            <div>القيمة الإجمالية النهائية:</div>
            <div><span id="grandTotal">0.00</span> دج</div>
        </div>
    </div>
</div>

<script>
    // تعيين تاريخ اليوم تلقائياً عند فتح الصفحة
    document.getElementById('invoiceDate').valueAsDate = new Date();

    function addRow() {
        const tbody = document.getElementById('rowsContainer');
        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td><input type="text" placeholder="اسم المادة"></td>
            <td><input type="number" step="0.01" min="0" class="unit-price" oninput="calculateRow(this)" placeholder="0.00"></td>
            <td><input type="number" min="1" value="1" class="qty" oninput="calculateRow(this)" placeholder="1"></td>
            <td class="row-total">0.00</td>
            <td class="action-col"><button type="button" class="btn btn-danger" onclick="removeRow(this)">حذف</button></td>
        `;

        tbody.appendChild(tr);
        updateSummary();
    }

    function calculateRow(element) {
        const row = element.closest('tr');
        const price = parseFloat(row.querySelector('.unit-price').value) || 0;
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        const total = price * qty;

        row.querySelector('.row-total').textContent = total.toFixed(2);
        updateSummary();
    }

    function removeRow(button) {
        button.closest('tr').remove();
        updateSummary();
    }

    function updateSummary() {
        const rows = document.querySelectorAll('#rowsContainer tr');
        let subTotal = 0;

        rows.forEach(row => {
            const rowTotal = parseFloat(row.querySelector('.row-total').textContent) || 0;
            subTotal += rowTotal;
        });

        // حساب نسبة الخصم
        const discountPercent = parseFloat(document.getElementById('discountPercent').value) || 0;
        const discountAmount = (subTotal * discountPercent) / 100;
        const grandTotal = subTotal - discountAmount;

        // تحديث عدد الأنواع
        document.getElementById('itemsCount').textContent = rows.length;

        // تحديث القيم في الواجهة
        document.getElementById('subTotal').textContent = subTotal.toFixed(2);
        document.getElementById('grandTotal').textContent = grandTotal.toFixed(2);
    }

    // إضافة سطر أول عند تحميل الصفحة
    window.onload = function() {
        addRow();
    };
</script>

</body>
</html>
